<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Glowing Emblem Circle -->
  <circle cx="256" cy="220" r="140" fill="url(#brandGrad)" opacity="0.15" filter="url(#glow)"/>
  <rect x="146" y="110" width="220" height="220" rx="48" fill="url(#brandGrad)" filter="url(#glow)"/>

  <!-- Graduation Cap Icon -->
  <path d="M256 160 L330 198 L256 236 L182 198 Z" fill="#ffffff" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.3))"/>
  <path d="M204 220 L204 260 C204 280, 308 280, 308 260 L308 220 L256 246 Z" fill="rgba(255,255,255,0.92)"/>
  <line x1="330" y1="198" x2="330" y2="245" stroke="#facc15" stroke-width="6" stroke-linecap="round"/>
  <circle cx="330" cy="250" r="7" fill="#facc15"/>

  <!-- Heartbeat / Pulse Line across bottom -->
  <path d="M120 370 L190 370 L215 330 L240 410 L272 310 L298 390 L322 370 L392 370" fill="none" stroke="url(#pulseGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="drop-shadow(0 0 10px rgba(56,189,248,0.7))"/>

  <!-- Brand Text -->
  <text x="256" y="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">StudyPulse</text>
</svg>
